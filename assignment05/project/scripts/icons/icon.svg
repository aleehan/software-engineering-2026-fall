<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Иконка приложения: жёлтая карточка судьи на графитовой плитке. -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f7d04e"/>
      <stop offset="0.55" stop-color="#efbd2a"/>
      <stop offset="1" stop-color="#e2ac1c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#19191b"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#ededed" stroke-opacity="0.1"/>
  <g transform="rotate(8 256 256)" filter="url(#shadow)">
    <rect x="160" y="124" width="192" height="264" rx="20" fill="url(#card)"/>
    <rect x="160" y="124" width="192" height="264" rx="20" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="2"/>
  </g>
</svg>
